name = "nrupalakolkar-site"
main = "src/index.ts"
compatibility_date = "2026-07-15"

# Static Assets: the pages + books.html are served directly from ./public.
# html_handling maps /books -> books.html, / -> index.html, etc.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

# Custom-domain routes (this Worker replaces the previous hex-gzip deploy of
# the same name -- a clean cutover on first deploy).
[[routes]]
pattern = "nrupalakolkar.com/*"
zone_name = "nrupalakolkar.com"

[[routes]]
pattern = "www.nrupalakolkar.com/*"
zone_name = "nrupalakolkar.com"

# Durable capture of every form submission (contact, launch-notify, book order).
# 'nk-submissions' namespace created 2026-08-02.
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "5f9a6407028a45cfa928d9397d4c74e9"

# Form submissions are forwarded to a Google Apps Script Web App that appends a
# row to the linked Google Sheet AND emails Nrupal. Set these as SECRETS
# (capability URL -- do not commit):
#   wrangler secret put APPSCRIPT_URL      # the Apps Script /exec URL
#   wrangler secret put APPSCRIPT_SECRET   # shared secret, must match Code.gs
# Even before these are set, submissions are captured in the SUBMISSIONS KV
# namespace above, so nothing is lost.
