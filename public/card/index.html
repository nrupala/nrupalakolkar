<!DOCTYPE html><html lang="en" data-theme="dark"><head>
<script>(function(){try{var t=localStorage.getItem('nrupalakolkar-theme');if(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches){t='bright';}document.documentElement.setAttribute('data-theme',t||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<link rel="stylesheet" href="/assets/chakra-theme.css">
